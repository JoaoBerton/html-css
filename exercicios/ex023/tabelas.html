<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            border: 1px, solid, black;
            border-collapse: collapse;
            width: 400px;
        }
        tr {
            height: 30px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.1em;
            
            
        }
        td {
            border: 1px, solid, black;  
        }
        td.obj {
            text-align: right;
            background-color: silver;
        }
        td.ps {
            vertical-align: middle;
            background-color: gold;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>A1</td>
            <td class="obj">B1</td>
            <td>C1</td>
            <td>D1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
            <td class="ps">D2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
            <td>D3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
            <td>D4</td>
        </tr>
    </table>
</body>
</html>
