<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <link rel="shortcut icon" href="imagens/amoremcantos.ico" type="image/x-icon">
    <style>
        @charset "UTF-8";
        /* Conf para estilo padrão */
        * {
    margin: 0;
    padding: 0;
}
html, body {
    height: 100vh;
    width: 100vw;
    background-color: #233eff;
}
h1 {
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    padding: 10px;
}
/*Para conf o estilo retrato */
@media screen, (orientation: portrait) {
   body{
    background: url(../imagens/cev-portrait.jpg) left bottom no-repeat;
    background-size: contain;
   }
} 
/* Para conf o estilo paisagem */
@media screen, (orientation: landscape) {
    body {
    background: url(../imagens/cev-landscape.jpg) bottom center no-repeat;
    background-size: contain;
    }
}
    </style>
<body>
    <h1>Mude sua orientação para dispositivos!</h1>
</body>
</html>
