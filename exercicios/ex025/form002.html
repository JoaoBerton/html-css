<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        h1 {
            border: 2px solid rgb(97, 97, 44);
            background-image: linear-gradient(to right, rgb(60, 60, 196), transparent);
            color: rgb(34, 34, 35);
            text-shadow: 4px 4px 8px rgba(255, 255, 255, 0.39);
            border-top-right-radius: 10px;
            border-bottom-left-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Testando formulários</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required placeholder="Digite o nome do usuário." size="20" autocomplete="current-password">
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" minlength="10" maxlength="15" required placeholder="min 10 caracteres." size="15" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
