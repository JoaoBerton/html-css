<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Testando formulários</h1>
    <form action="cadastro.php" autocomplete="on">
        <p>
            <label for="ialuno">Aluno:</label>
            <input type="text" name="aluno" id="ialuno" required placeholder="Nome do aluno" maxlength="30" autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" required minlength="1" maxlength="10" placeholder="Digite a média" step="0.1">
        </p>
        <p>
            <label for="imes">Data de matrícula:</label>
            <input type="month" name="mes" id="imes"  required autocomplete="bday-month" value="2020-07">
        </p>
        <p>
            <label for="idata">Dia da prova:</label>
            <input type="date" name="data" id="idata" required value="2007-08-15">
        </p>
        <p>
            <label for="ihora">Horário da prova:</label>
            <input type="time" name="hora" id="ihora" required>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
