<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test/formJS</title>
</head>
<body>
    <h1>Testando Output com JS</h1>
    <form action="cadastro.php" method="get">
        <label for="iidade">Em que ano você nasceu?</label>
        <input type="number" name="ano" id="iano" min="1900" max="2025" required oninput="calcIdade()">
        <p>
            <label for="iidade">A sua idade é:</label>
            <output name="idade" id="iidade">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    <script>
        function calcIdade(){
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
