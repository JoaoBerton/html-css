<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela completa</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 400px;
            border-collapse: collapse;
        }
        caption {
            font-size: 1.5em;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .color {
            background-color: gray;
            color: white;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <caption>
        Média de notas do aluno
    </caption>
        <thead class="color">
            <th rowspan="2" scope="row">Área</th>
            <th rowspan="2" scope="row">Disciplinas</th>
            <th colspan="2" scope="rowgroup">Notas</th>
            <th rowspan="2" scope="row">Média</th>
            <tr>
                <th>Nota1</th>
                <th>Nota2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="colgroup">Exatas</th>
                <td>Matemática</td>
                <td>50</td>
                <td>70</td>
                <td>60</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>60</td>
                <td>90</td>
                <td>75</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>30</td>
                <td>100</td>
                <td>65</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>80</td>
                <td>70</td>
                <td>75</td>
            </tr>
            <tr class="color">
                <th colspan="4" scope="col">Média de exatas</th>
                <td>68,75</td>
            </tr>
            <tr>
                <th rowspan="4" scope="colgroup">Humanas</th>
                <td>História</td>
                <td>100</td>
                <td>95</td>
                <td>97,5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>65</td>
                <td>85</td>
                <td>75</td>
            </tr>
            <tr>
                <td>Português</td>
                <td>75</td>
                <td>80</td>
                <td>77,5</td>
            </tr>
            <tr>
                <td>Literatura</td>
                <td>90</td>
                <td>95</td>
                <td>92,5</td>
            </tr>
            <tr class="color">
                <th colspan="4" scope="col">Média das humanas</th>
                <td>86</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
